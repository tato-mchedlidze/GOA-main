<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    {% if movie %}
    <h2>{{ movie.title }}</h2>
    <p>Director: {{ movie.director }}</p>
    <p>Year: {{ movie.year }}</p>
    {% else %}
    <p>Movie not found</p>
    {% endif %}
</body>

</html>
