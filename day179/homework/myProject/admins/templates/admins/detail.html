<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
        }

        .card {
            width: 300px;
            margin: 50px auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }
    </style>
</head>

<body>
    {% if admin %}
    <div class="card">
        <h2>{{ admin.admin_name }}</h2>
        <p>ID: {{ admin.id }}</p>
        <p>Role: {{ admin.role }}</p>
    </div>
    {% else %}
    <div class="card">
        <p>Admin not found</p>
    </div>
    {% endif %}
</body>

</html>
