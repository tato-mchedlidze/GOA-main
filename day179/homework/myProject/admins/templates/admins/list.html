<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
        }

        table {
            border-collapse: collapse;
            width: 60%;
            margin: 30px auto;
            background: white;
        }

        th,
        td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: left;
        }

        th {
            background: #333;
            color: white;
        }
    </style>
</head>

<body>
    <table>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Role</th>
        </tr>
        {% for admin in admins_database %}
        <tr>
            <td>{{ admin.id }}</td>
            <td><a href="/admins/{{ admin.id }}/">{{ admin.admin_name }}</a></td>
            <td>{{ admin.role }}</td>
        </tr>
        {% endfor %}
    </table>
</body>

</html>
