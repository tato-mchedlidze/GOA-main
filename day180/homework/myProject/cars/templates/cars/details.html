<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    {% if car %}
    <h2>{{ car.brand }} {{ car.model }}</h2>
    <p>Color: {{ car.color }}</p>
    <p>Year: {{ car.year }}</p>
    {% else %}
    <p>Car not found</p>
    {% endif %}
</body>

</html>
